<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08131f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALPHA CORE" />
    <meta name="application-name" content="ALPHA CORE" />
    <meta name="msapplication-TileColor" content="#08131f" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json?v=3.9.1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v351.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/alpha-core-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v351.png" />
    <script>
      try {
        const savedTheme = localStorage.getItem("alpha-platform-theme");
        const theme = savedTheme === "light" ? "light" : "dark";
        const savedLanguage = localStorage.getItem("alpha-core-language");
        const language = savedLanguage === "ar" ? "ar" : "en";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.language = language;
        document.documentElement.lang = language;
        document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#08131f" : "#f4f8fc");
      } catch (_) {}
    </script>
    <meta name="description" content="ALPHA PLATFORM — high-tech Egyptian equity intelligence, portfolio performance, market news and stock recommendations." />
    <title>ALPHA PLATFORM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
