<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111d" />
    <script>
      try {
        const savedTheme = localStorage.getItem("alpha-platform-theme");
        const theme = savedTheme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {}
    </script>
    <meta name="description" content="ALPHA PLATFORM — high-tech Egyptian equity intelligence, portfolio performance, market news and stock recommendations." />
    <title>ALPHA PLATFORM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
